name: Danger Comment

on:
  workflow_run:
    workflows: [Danger]
    types: [completed]

jobs:
  comment:
    uses: numbata/danger-pr-comment/.github/workflows/danger-comment.yml@6152b4436901a31e3ebbf09152ae182282487a75 # v0.2.0
    # What the called workflow asks for. It needs no secret but the token.
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
