name: Danger Comment

on:
  workflow_run:
    workflows: [Danger]
    types: [completed]

jobs:
  comment:
    uses: danger/danger-pr-comment/.github/workflows/danger-comment.yml@645e89bcc7be89ee7e8362166110b05cbced8e59 # v0.3.0
    # What the called workflow asks for. It needs no secret but the token.
    permissions:
      actions: read
      issues: write
      pull-requests: write
    # Post a report only when Danger has something to say; an existing report comment is still updated.
    with:
      comment-empty: false
