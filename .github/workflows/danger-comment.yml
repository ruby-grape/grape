name: Danger Comment

on:
  workflow_run:
    workflows: [Danger]
    types: [completed]

jobs:
  comment:
    uses: numbata/danger-pr-comment/.github/workflows/danger-comment.yml@34fd37617a87c09a408c39646d871cd3b6135eb9 # v0.1.0
    # What the called workflow asks for. It needs no secret but the token.
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
